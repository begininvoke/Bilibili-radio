services:
  backend:
    build:
      context: ./py-radio
    container_name: bilibili-radio-backend
    restart: unless-stopped
    environment:
      AUTH_MODE: ${AUTH_MODE:-oidc}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      APP_EXTERNAL_URL: ${APP_EXTERNAL_URL:-}
      APP_SESSION_TTL_SECONDS: ${APP_SESSION_TTL_SECONDS:-604800}
      APP_SESSION_IDLE_SECONDS: ${APP_SESSION_IDLE_SECONDS:-86400}
      APP_ADMIN_SESSION_TTL_SECONDS: ${APP_ADMIN_SESSION_TTL_SECONDS:-28800}
      APP_SESSION_MAX_ACTIVE: ${APP_SESSION_MAX_ACTIVE:-5}
      APP_TRUSTED_HOSTS: ${APP_TRUSTED_HOSTS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_BOOTSTRAP_ADMIN_ISSUER: ${OIDC_BOOTSTRAP_ADMIN_ISSUER:-}
      OIDC_BOOTSTRAP_ADMIN_SUBJECT: ${OIDC_BOOTSTRAP_ADMIN_SUBJECT:-}
      OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP:-false}
      ALLOW_INSECURE_LOCAL_AUTH: ${ALLOW_INSECURE_LOCAL_AUTH:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_THREADS: ${WEB_THREADS:-16}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-}
    volumes:
      - ./server-data:/app/data
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: ./bilibili-player/Dockerfile
    container_name: bilibili-radio-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
