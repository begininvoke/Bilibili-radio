<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能省流后台播放助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="popup-container">
    <!-- 顶部状态栏 -->
    <div class="status-bar">
      <div class="status-info">
        <div class="status-icon" id="statusIcon">🟢</div>
        <div class="status-text" id="statusText">前台播放中</div>
      </div>
      <div class="mode-info">
        <div class="mode-label">当前模式：</div>
        <div class="mode-value" id="modeValue">全画质</div>
      </div>
    </div>

    <!-- 核心数据仪表盘 -->
    <div class="dashboard">
      <div class="circle-progress">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="50" fill="none" stroke="#2d3748" stroke-width="8"/>
          <circle cx="60" cy="60" r="50" fill="none" stroke="#4fd1c5" stroke-width="8" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="157" id="progressCircle"/>
          <text x="60" y="55" text-anchor="middle" class="progress-text" id="savedTraffic">0 MB</text>
          <text x="60" y="75" text-anchor="middle" class="progress-label">已节省流量</text>
        </svg>
      </div>
      <div class="speed-info">
        <div class="speed-label">实时下行速率</div>
        <div class="speed-value" id="downloadSpeed">0 KB/s</div>
      </div>
      <div class="traffic-info">
        <div class="traffic-item">
          <div class="traffic-label">本次会话</div>
          <div class="traffic-value" id="sessionTraffic">0 MB</div>
        </div>
        <div class="traffic-item">
          <div class="traffic-label">总计流量</div>
          <div class="traffic-value" id="totalTraffic">0 MB</div>
        </div>
      </div>
    </div>

    <!-- 功能开关区 -->
    <div class="settings-section">
      <h3>功能设置</h3>
      <div class="setting-item">
        <div class="setting-label">智能省流模式</div>
        <label class="toggle-switch">
          <input type="checkbox" id="smartSaveToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <div class="setting-label">自动净化弹幕/背景</div>
        <label class="toggle-switch">
          <input type="checkbox" id="cleanupToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <div class="setting-label">流量监控</div>
        <label class="toggle-switch">
          <input type="checkbox" id="trafficToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- 详细日志入口 -->
    <div class="logs-section">
      <div class="logs-header" id="logsHeader">
        <span>查看详情</span>
        <span class="expand-icon" id="expandIcon">▼</span>
      </div>
      <div class="logs-content" id="logsContent">
        <div class="log-item" id="logItemTemplate" style="display: none;">
          <div class="log-time"></div>
          <div class="log-site"></div>
          <div class="log-traffic"></div>
          <div class="log-saved"></div>
        </div>
        <div id="logList">
          <!-- 日志项将通过JavaScript动态添加 -->
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
